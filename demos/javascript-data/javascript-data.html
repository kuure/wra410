<!doctype html>

<html lang="en">

<head>

<title>JavaScript Data Exercise</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

<h1>JavaScript Data</h1>


<div class="dataOne"></div>

<div class="dataTwo"></div>


<script>

// set up an array of strings - text values, in quotes, separated by commas
const pokeArray = ["Pyroar","Talonflame","Ninetails","Poliwrath","Tyranitar"]

// log it to the console:
console.log("The initial array:",pokeArray)


// accessing single elements by index
console.log(`pokeArray Index 0: ${pokeArray[0]}`)
console.log(`pokeArray Index 3: ${pokeArray[3]}`)



const pokeObject = {
  name: "Pikachu",
  type: "Electric",
  species: "Mouse Pokemon",
}

// access individual elements
console.log("pokeObject.name:",pokeObject.name)
console.log("pokeObject.type:",pokeObject.type)




</script>

</body>
</html>
