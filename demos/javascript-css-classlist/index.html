<!doctype html>

<head>

	<title>WRA410 CSS classList</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>

	.serif {
		font-family: "Times New Roman", serif;
	}

	.sans {
		font-family: "Helvertica", "Arial", sans-serif;
	}

	.magenta {
		color: rgb(255,255,255);
		background-color: rgb(255,0,255);
	}
	.cyan {
		color: rgb(0,0,0);
		background-color: rgb(0,255,255);
	}

	.light {
		color: rgb(0,0,0);
		background-color: rgb(255,255,255);
	}

	.dark {
		color: rgb(255,255,255);
		background-color: rgb(0,0,0);	
	}


	</style>


</head>


<body>


	<h1 class="sans magenta">WRA410 CSS classList</h1>

	<p>See if you can set up a simple dark / light mode display triggered by the
		button...</p>

	<div>
		<button class="modeButton">Dark or Light Mode</button>
	</div>


	<script>

		const h1 = document.querySelector("h1");
		console.log("h1 classlist: ",h1.classList);


		// add your light and dark mode here...

		const body = document.querySelector("body");
		const button = document.querySelector("button");

		button.addEventListener("click", () => {

			// if the classList - an array of all the classes applied
			// to an element - contains the string "light" OR has a length of zero,
			// then set the classList value to "dark"
			if(body.classList.contains("light") || body.classList.length === 0) {
				body.classList = "dark";
			}
			// in any other situation, make set it to "light" 
			else {
				body.classList = "light";
			}

		});

	</script>

</body>
</html>
